[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["config/**"]

# Friendlier URLs for the board to call
[[redirects]]
  from = "/api/feed"
  to = "/.netlify/functions/board-feed"
  status = 200

[[redirects]]
  from = "/api/report-meta"
  to = "/.netlify/functions/report-meta"
  status = 200
