<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>AR Board — Omaha Drain</title>
<link rel="icon" href="https://cdn.prod.website-files.com/689e50eba40afe3da9c26455/6936fd45b2dbb841742c630f_b1b16ae6b9097b62674e58d9e373a5d0_Omaha%20logo.avif">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Expanded:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    /* Omaha Drain palette, sampled from the logo: deep navy and the cyan
       wave. Navy replaces black for every ink level, so the whole board
       reads as the brand rather than as a generic dashboard. */
    --navy:#0B2A45;
    --cyan:#29ABC8;

    --surface:#EEF3F6;
    --card:#ffffff;
    --ink:#0B2A45;
    --ink-2:#40607C;
    --ink-3:#8AA0B4;
    --line:#DDE6EC;
    --track:#C7D5E0;

    /* Status palette. Reserved for state, never reused as decoration.
       Orange vs green are not separable for red-green colour blindness,
       so every dial also prints its number and a status word — colour
       is never the only channel carrying the reading. */
    --good:#0ca30c;
    --warn:#ec835a;
    --bad:#d03b3b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--surface);
    color:var(--ink);
    font-family:'Archivo',system-ui,sans-serif;
    font-size:15px;
    -webkit-font-smoothing:antialiased;
    padding:20px 22px 0;
    display:flex;flex-direction:column;gap:14px;min-height:100%;
  }
  .row{display:flex;align-items:center;gap:14px}
  /* Hides itself via onerror if logo.png is not in the repo, so a
     missing file never shows a broken-image icon on the wall. */
  #logo{height:52px;width:52px;flex:none;display:block}
  .row h1,.row .sub{align-self:baseline}
  h1{font-family:'Archivo Expanded','Archivo',sans-serif;font-weight:800;font-size:30px;letter-spacing:-.01em}
  .sub{font-weight:600;font-size:13px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em}
  .spacer{margin-left:auto}
  .clock{font-family:'Archivo Expanded','Archivo',sans-serif;font-weight:700;font-size:24px;font-variant-numeric:tabular-nums}
  .stamp{font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;text-align:right}

  .card{background:var(--card);border-radius:14px;border:1px solid var(--line);padding:16px 18px}

  .gauges{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .gauge{display:flex;flex-direction:column;align-items:center;gap:2px;padding-bottom:12px}
  .gauge h2{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-2);margin-bottom:6px}
  .gauge svg{width:100%;max-width:300px;height:auto;display:block;margin-bottom:2px}
  .gauge .pct{font-family:'Archivo Expanded','Archivo',sans-serif;font-size:34px;font-weight:800;
              letter-spacing:-.02em;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1}
  .gauge .amt{font-size:14px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}
  .gauge .target{font-size:11px;color:var(--ink-3);margin-top:7px;letter-spacing:.02em}
  .gauge .delta{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;margin-top:2px}
  .pill{display:inline-flex;align-items:center;gap:7px;margin-top:8px;padding:4px 12px;border-radius:999px;background:#f1f2ef;
        font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
  .dot{width:9px;height:9px;border-radius:50%;flex:none}

  main{display:grid;grid-template-columns:minmax(0,2.05fr) minmax(300px,1fr);gap:14px;flex:1;align-items:start}

  .listhead{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
  .listhead h2{font-family:'Archivo Expanded','Archivo',sans-serif;font-size:17px;font-weight:700;letter-spacing:.01em}
  .listhead .hint{font-size:12px;color:var(--ink-3);margin-left:auto;text-transform:uppercase;letter-spacing:.06em}

  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);text-align:left;padding:0 8px 8px;font-weight:700}
  th.r,td.r{text-align:right}
  td{padding:7px 8px;border-top:1px solid var(--line);font-size:15px}
  tr.done td{color:var(--ink-3)}
  tr.done td.nm{text-decoration:line-through}
  td.rk{color:var(--cyan);font-size:13px;font-weight:700;width:26px}
  td.nm{font-weight:600;max-width:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  td.ow{font-weight:700}
  td.tot{color:var(--ink-3);font-size:13px}
  td.tot .same{color:#c3c2be}
  td.bk{color:var(--ink-2);font-size:13px;white-space:nowrap}
  td.ck{width:34px;text-align:center}
  input[type=checkbox]{width:17px;height:17px;cursor:pointer;accent-color:var(--cyan)}
  .overflow{margin-top:10px;font-size:12px;color:var(--ink-3);border-top:1px solid var(--line);padding-top:9px}

  .tiles{display:flex;flex-direction:column;gap:14px}
  .tile .lab{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3)}
  .tile .big{font-family:'Archivo Expanded','Archivo',sans-serif;font-size:34px;font-weight:800;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
  .tile .meta{font-size:13px;color:var(--ink-2);margin-top:3px}
  .tile .note{font-size:12px;color:var(--ink-3);margin-top:8px;line-height:1.45}
  .owner{display:inline-block;margin-top:8px;padding:3px 10px;border-radius:999px;background:#f1f2ef;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
  .good-news{color:var(--good);font-weight:700}

  footer{border-top:1px solid var(--line);padding:12px 2px 16px;display:flex;gap:26px;flex-wrap:wrap;align-items:baseline}
  footer .lab{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--cyan)}
  footer ul{list-style:none;display:flex;gap:22px;flex-wrap:wrap}
  footer li{font-size:13px;color:var(--ink-2);position:relative;padding-left:14px}
  footer li::before{content:"";position:absolute;left:0;top:7px;width:5px;height:5px;border-radius:50%;background:var(--cyan)}

  #err{display:none;background:#fdecea;border:1px solid #f3c6c1;color:#8a2018;border-radius:10px;padding:9px 14px;font-size:13px}
</style>
</head>
<body>

<div class="row">
  <!-- Hosted on the Webflow CDN. If it ever fails to load the element
       hides itself rather than showing a broken-image icon. To swap the
       logo, change this one URL. -->
  <img id="logo" alt="Omaha Drain"
       src="https://cdn.prod.website-files.com/689e50eba40afe3da9c26455/6936fd45b2dbb841742c630f_b1b16ae6b9097b62674e58d9e373a5d0_Omaha%20logo.avif"
       onerror="this.style.display='none'">
  <h1 id="title">ACCOUNTS RECEIVABLE</h1>
  <span class="sub" id="subtitle"></span>
  <div class="spacer"></div>
  <div style="text-align:right">
    <div class="clock" id="clock">—</div>
    <div class="stamp" id="stamp">loading</div>
  </div>
</div>

<div id="err"></div>

<section class="gauges" id="gauges"></section>

<main>
  <section class="card">
    <div class="listhead">
      <h2>Today's Worklist</h2>
      <span class="hint" id="worklistHint"></span>
    </div>
    <table>
      <thead><tr>
        <th style="width:26px"></th><th>Customer</th>
        <th class="r" id="pdHead">Past Due</th><th class="r">Total Owed</th>
        <th class="r">Oldest</th><th class="r" style="width:34px">Done</th>
      </tr></thead>
      <tbody id="worklist"></tbody>
    </table>
    <div class="overflow" id="overflow"></div>
  </section>

  <section class="tiles" id="tiles"></section>
</main>

<footer>
  <span class="lab">Daily</span>
  <ul id="checklist"></ul>
</footer>

<script>
const REFRESH_MS = 5 * 60 * 1000;   // server caches; this just re-reads it
const RELOAD_MS  = 6 * 60 * 60 * 1000;
let failures = 0;

const money = n => '$' + Math.round(n).toLocaleString('en-US');
const moneyExact = n => '$' + n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const colorFor = b => b === 'good' ? 'var(--good)' : b === 'warn' ? 'var(--warn)' : 'var(--bad)';

/* ---------- gauge ----------------------------------------------------
   240-degree dial: 0 at lower-left, 50 at top, 100 at lower-right.
   Angle is measured from 12 o'clock, clockwise, which is why x uses sin
   and y uses -cos.

   41 ticks at 2.5-unit steps. Every second tick lands on a multiple of
   five, runs longer, and carries a number — so the dial is readable as a
   scale, not just as a proportion of filled colour. The needle points at
   the current value and the percentage is printed underneath. */
const SWEEP = 240, HALF = SWEEP/2, TICKS = 41;
const pt = (cx,cy,r,deg) => {
  const a = deg * Math.PI/180;
  return [cx + r*Math.sin(a), cy - r*Math.cos(a)];
};

function gaugeSVG(g){
  const W=300, H=226, cx=150, cy=148;
  const rOut=110, rInMajor=86, rInMinor=94, rLabel=127;
  const angleAt = v => -HALF + SWEEP*(v/100);
  const fill = colorFor(g.band);

  let s = `<svg viewBox="0 0 ${W} ${H}" role="img"
    aria-label="${g.label}: ${g.percent} percent of receivables, ${g.bandLabel}">`;

  for(let i=0;i<TICKS;i++){
    const v = i*(100/(TICKS-1));
    const major = i % 2 === 0;
    const deg = angleAt(v);
    const on = v <= g.percent + 0.001;
    const [x1,y1] = pt(cx,cy, major?rInMajor:rInMinor, deg);
    const [x2,y2] = pt(cx,cy, rOut, deg);
    s += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"
          stroke="${on?fill:'var(--track)'}" stroke-width="${major?7:5}" stroke-linecap="round"/>`;
    if(major){
      const [lx,ly] = pt(cx,cy,rLabel,deg);
      s += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="9.5" font-weight="700"
            fill="var(--ink-3)" text-anchor="middle" dominant-baseline="central">${Math.round(v)}</text>`;
    }
  }

  // Needle. Drawn pointing straight up from the hub, then rotated to the
  // value — far easier to keep correct than building the shape at an angle.
  const deg = angleAt(Math.max(0, Math.min(100, g.percent)));
  s += `<g transform="rotate(${deg.toFixed(2)} ${cx} ${cy})">
      <path d="M ${cx-9} ${cy} Q ${cx-7} ${cy-38} ${cx} ${cy-56}
               Q ${cx+7} ${cy-38} ${cx+9} ${cy}
               A 9 9 0 0 1 ${cx-9} ${cy} Z" fill="var(--navy)"/>
    </g>`;
  s += `<circle cx="${cx}" cy="${cy}" r="3.4" fill="#fff"/>`;

  return s + '</svg>';
}

function renderGauges(d){
  document.getElementById('gauges').innerHTML = d.gauges.map(g => {
    let delta = '';
    if (g.deltaPercent !== null && g.deltaPercent !== undefined){
      const s = g.deltaPercent, arrow = s < 0 ? '▼' : s > 0 ? '▲' : '■';
      const word = s < 0 ? 'better' : s > 0 ? 'worse' : 'flat';
      delta = `<div class="delta">${arrow} ${Math.abs(s).toFixed(1)} pts ${word} than last week</div>`;
    }
    return `<div class="card gauge">
      <h2>${g.label}</h2>
      ${gaugeSVG(g)}
      <div class="pct">${g.percent.toFixed(1)}%</div>
      <div class="amt">${money(g.amount)} past this mark</div>
      ${delta}
      <span class="pill"><span class="dot" style="background:${colorFor(g.band)}"></span>${g.bandLabel}</span>
      <div class="target">Target ${(g.bands||d.bands).goodMax}% or under · ${(g.bands||d.bands).warnMax}%+ is critical</div>
    </div>`;
  }).join('');
}

/* ---------- worklist ------------------------------------------------- */
const doneKey = day => 'ar-called-' + day;
function getDone(day){ try { return new Set(JSON.parse(localStorage.getItem(doneKey(day)) || '[]')); } catch(e){ return new Set(); } }
function setDone(day,set){ try { localStorage.setItem(doneKey(day), JSON.stringify([...set])); } catch(e){} }

function renderWorklist(d){
  const day = d.asOfDate, done = getDone(day);
  const tb = document.getElementById('worklist');

  document.getElementById('pdHead').textContent = d.worklistLabel || 'Past Due';

  if(!d.worklist.length){
    tb.innerHTML = `<tr><td colspan="6" style="padding:26px 8px" class="good-news">
      Nothing past due above ${money(d.worklistOverflow.minPastDue)}. Enjoy it.</td></tr>`;
    document.getElementById('overflow').textContent = '';
    document.getElementById('worklistHint').textContent = '';
    return;
  }

  tb.innerHTML = d.worklist.map(w => {
    const isDone = done.has(w.name);
    // Total is shown greyed and only when it differs — so the caller knows to
    // ask about the past-due portion, not the whole balance.
    const total = w.hasCurrentToo
      ? `<span title="Total balance including invoices not yet past due">${moneyExact(w.totalOwed)}</span>`
      : '<span class="same">same</span>';
    return `<tr class="${isDone?'done':''}" data-name="${escapeAttr(w.name)}">
      <td class="rk">${w.rank}</td>
      <td class="nm" title="${escapeAttr(w.name)}">${escapeHTML(w.name)}</td>
      <td class="r ow">${moneyExact(w.pastDue)}</td>
      <td class="r tot">${total}</td>
      <td class="r bk">${w.oldestBucket}</td>
      <td class="ck"><input type="checkbox" ${isDone?'checked':''} aria-label="Called ${escapeAttr(w.name)}"></td>
    </tr>`;
  }).join('');

  tb.querySelectorAll('input[type=checkbox]').forEach(cb => {
    cb.addEventListener('change', e => {
      const tr = e.target.closest('tr'), name = tr.dataset.name, set = getDone(day);
      e.target.checked ? set.add(name) : set.delete(name);
      setDone(day,set);
      tr.classList.toggle('done', e.target.checked);
      updateHint(d);
    });
  });

  updateHint(d);
  const o = d.worklistOverflow;
  document.getElementById('overflow').textContent = o.customersNotShown > 0
    ? `${o.customersNotShown} more past-due accounts below this list, ${money(o.amountNotShown)} between them. Anything under ${money(o.minPastDue)} past due is not listed.`
    : 'This is every past-due account above the minimum.';
}

function updateHint(d){
  const done = getDone(d.asOfDate);
  const n = d.worklist.filter(w => done.has(w.name)).length;
  document.getElementById('worklistHint').textContent = `${n} of ${d.worklist.length} called today`;
}

/* ---------- tiles ---------------------------------------------------- */
function renderTiles(d){
  const t = [];
  const o = d.oldestTile;

  let od = '';
  if(o.delta !== null && o.delta !== undefined){
    const better = o.delta < 0;
    od = `<div class="meta" style="color:${better?'var(--good)':'var(--ink-2)'}">
            ${better?'▼':'▲'} ${money(Math.abs(o.delta))} ${better?'collected':'added'} this week</div>`;
  }
  t.push(`<div class="card tile">
    <div class="lab">${o.label}</div>
    <div class="big">${money(o.amount)}</div>
    <div class="meta">${o.customers} accounts</div>${od}</div>`);

  const s = d.slippingTile;
  t.push(`<div class="card tile">
    <div class="lab">${s.label}${s.sublabel?' · '+s.sublabel:''}</div>
    ${ s.customers === 0
        ? `<div class="big good-news" style="font-size:22px;line-height:1.3;margin-top:8px">${s.emptyMessage}</div>`
        : `<div class="big">${money(s.amount)}</div><div class="meta">${s.customers} account${s.customers===1?'':'s'} about to turn 90</div>` }
    </div>`);

  const m = d.membershipTile;
  if(m.enabled){
    t.push(`<div class="card tile">
      <div class="lab">${m.label}</div>
      <div class="big">${money(m.amount)}</div>
      <div class="meta">${m.customers} accounts</div>
      <div class="note">${escapeHTML(m.note)}</div></div>`);
  }

  document.getElementById('tiles').innerHTML = t.join('');
}

/* ---------- shell ---------------------------------------------------- */
function escapeHTML(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHTML(s); }

function tick(){
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
}

async function load(){
  try{
    const r = await fetch('/api/ar', {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    if(!d.ok) throw new Error(d.error || 'feed error');

    document.getElementById('title').textContent = d.title;
    document.getElementById('subtitle').textContent = d.subtitle;

    renderGauges(d);
    renderWorklist(d);
    renderTiles(d);

    document.getElementById('checklist').innerHTML =
      d.checklist.map(c => `<li>${escapeHTML(c)}</li>`).join('');

    const age = d.cacheAgeSeconds || 0;
    const mins = Math.round(age/60);
    document.getElementById('stamp').textContent =
      (d.stale ? 'stale · ' : '') +
      'as of ' + d.asOfDate + (mins > 0 ? ` · data ${mins} min old` : ' · just refreshed');

    const err = document.getElementById('err');
    if(d.stale){
      err.style.display='block';
      err.textContent = 'Showing the last good numbers — ServiceTitan did not answer on the most recent try.';
    } else { err.style.display='none'; }

    failures = 0;
  }catch(e){
    failures++;
    const err = document.getElementById('err');
    err.style.display='block';
    err.textContent = `Could not load the feed (${e.message}). Retry ${failures} of 4.`;
    // Kiosk watchdog: after four straight failures, reload the whole page.
    // Browsers left running for weeks fail in ways a fetch retry cannot fix.
    if(failures >= 4) location.reload();
  }
}

tick(); setInterval(tick, 15000);
load(); setInterval(load, REFRESH_MS);
setTimeout(() => location.reload(), RELOAD_MS);
</script>
</body>
</html>
